<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Voice Joy ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0d0820;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Nunito',sans-serif;overflow:hidden;touch-action:none;
}
canvas{display:block;}

/* ── HUD ── */
#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;z-index:10;pointer-events:none;
}
#score-display{
  font-size:2rem;font-weight:900;color:#fff;
  text-shadow:0 2px 12px #ff88cc,0 0 30px #ff44aa;
  transition:transform 0.15s;
}
#combo-display{
  font-size:1rem;font-weight:900;color:#ffee44;
  text-shadow:0 0 16px #ffaa00;opacity:0;
  transition:opacity 0.3s;letter-spacing:1px;
}
#stop-btn{
  position:fixed;top:14px;right:16px;z-index:15;
  padding:9px 20px;border-radius:50px;border:none;
  background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);
  color:#fff;font-family:'Nunito',sans-serif;font-size:0.85rem;
  font-weight:800;cursor:pointer;display:none;
  box-shadow:0 2px 16px #00000055;border:1px solid rgba(255,255,255,0.15);
  transition:all 0.2s;
}
#stop-btn:hover{background:rgba(255,80,140,0.45);transform:scale(1.05);}

/* ── Mic ── */
#mic-wrap{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  z-index:10;pointer-events:none;
}
#mic-bar{width:180px;height:8px;background:#ffffff18;border-radius:4px;overflow:hidden;}
#mic-fill{
  height:100%;width:0%;
  background:linear-gradient(to right,#ff55aa,#ffcc00,#44ffaa);
  border-radius:4px;transition:width 0.05s;
}
#mic-label{font-size:0.55rem;color:#ffffff33;letter-spacing:3px;font-family:monospace;}

/* ── Overlays base ── */
.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  overflow-y:auto;
  z-index:20;padding:24px 20px 32px;
  background:linear-gradient(160deg,#1e0640 0%,#0d1a55 50%,#091830 100%);
}
.overlay h1{
  font-size:clamp(2.2rem,9vw,4rem);font-weight:900;text-align:center;line-height:1.1;
  background:linear-gradient(135deg,#ff88cc,#ffee44,#88ffcc,#aabbff,#ff88cc);
  background-size:200%;animation:shimmer 3s linear infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px #ff88cc66);margin-bottom:4px;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}

.emoji-row{font-size:2rem;letter-spacing:10px;animation:bob 1.4s ease-in-out infinite alternate;margin:4px 0;}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}

.tagline{color:#ffffffaa;font-size:0.9rem;text-align:center;max-width:300px;line-height:2;margin-bottom:4px;}

/* ── Buttons ── */
.btn{
  padding:15px 44px;border-radius:50px;border:none;
  background:linear-gradient(135deg,#ff55aa,#ff9944);
  color:#fff;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;
  letter-spacing:1px;cursor:pointer;
  box-shadow:0 4px 30px #ff55aa66,0 0 60px #ff44aa22;
  transition:transform 0.15s,box-shadow 0.15s;text-transform:uppercase;
  white-space:nowrap;
}
.btn:hover{transform:scale(1.06);box-shadow:0 6px 40px #ff55aaaa;}
.btn:active{transform:scale(0.96);}
.btn-ghost{
  padding:11px 28px;border-radius:50px;
  border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.06);
  color:#ffffffcc;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;
  cursor:pointer;transition:all 0.2s;letter-spacing:1px;white-space:nowrap;
}
.btn-ghost:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.5);}

#mic-error{
  display:none;max-width:280px;text-align:center;font-size:0.78rem;
  color:#ffaa88;line-height:1.8;padding:12px 18px;
  border:1px solid #ffaa8855;border-radius:12px;background:#ffaa8815;
}

/* ── Leaderboard ── */
#lb-section{width:100%;max-width:380px;margin-top:8px;}
#lb-section h2{
  text-align:center;font-size:1.3rem;font-weight:900;margin-bottom:12px;
  background:linear-gradient(90deg,#ffee44,#ffaa44);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;
}
.lb-empty{color:#ffffff44;text-align:center;font-size:0.85rem;padding:16px;font-style:italic;}
.lb-row{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;
  padding:11px 14px;border-radius:14px;margin-bottom:7px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.07);
  font-size:0.9rem;color:#ffffffdd;
  transition:transform 0.2s;
}
.lb-row:hover{transform:scale(1.01);}
.lb-row.rank-1{
  background:linear-gradient(135deg,#ffaa0025,#ffee4425);
  border:1px solid #ffee4444;
  box-shadow:0 0 20px #ffee4415;
}
.lb-row.rank-2{
  background:linear-gradient(135deg,#aaaaff18,#ccccff18);
  border:1px solid #aaaaff33;
}
.lb-row.rank-3{
  background:linear-gradient(135deg,#ff885518,#ffaa6618);
  border:1px solid #ff885533;
}
.lb-row.highlight{
  border:2px solid #ffee44!important;
  box-shadow:0 0 24px #ffee4433!important;
  animation:highlightPulse 1s ease-in-out 3;
}
@keyframes highlightPulse{0%,100%{box-shadow:0 0 24px #ffee4433}50%{box-shadow:0 0 40px #ffee4499}}
.lb-medal{font-size:1.3rem;text-align:center;}
.lb-name{font-weight:800;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-pts{font-weight:900;color:#ffee44;font-size:1rem;text-shadow:0 0 8px #ffaa00;white-space:nowrap;}
.lb-date{font-size:0.65rem;color:#ffffff44;display:block;font-weight:400;margin-top:1px;}

/* ── End screen specifics ── */
#end-screen{display:none;}
.end-score-wrap{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(255,255,255,0.05);border-radius:20px;
  padding:18px 32px;border:1px solid rgba(255,255,255,0.1);
  margin-bottom:4px;width:100%;max-width:340px;
}
.end-label{color:#ffffff66;font-size:0.8rem;letter-spacing:3px;text-transform:uppercase;}
.end-score{
  font-size:4rem;font-weight:900;line-height:1;
  background:linear-gradient(135deg,#ffee44,#ff88cc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px #ffaa00aa);
}
.end-note{font-size:0.85rem;color:#88ffcc;font-weight:700;margin-top:2px;}

#card-wrap{display:none;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:380px;}
#score-card{border-radius:20px;box-shadow:0 0 50px #ff88cc55,0 0 100px #ff44aa22;max-width:100%;}
#share-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

#name-input{
  padding:13px 22px;border-radius:50px;
  border:2px solid rgba(255,136,204,0.4);
  background:rgba(255,255,255,0.07);
  color:#fff;font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:700;text-align:center;
  width:100%;max-width:300px;outline:none;
  transition:border-color 0.2s;
}
#name-input:focus{border-color:rgba(255,136,204,0.8);}
#name-input::placeholder{color:#ffffff44;}

.section-divider{
  width:100%;max-width:380px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  margin:6px 0;
}
</style>
</head>
<body>

<div id="hud">
  <div id="score-display">✨ 0</div>
  <div id="combo-display"></div>
</div>
<button id="stop-btn">⏹ Finish & Submit</button>
<canvas id="game"></canvas>
<div id="mic-wrap">
  <div id="mic-bar"><div id="mic-fill"></div></div>
  <div id="mic-label">🎤 VOICE LEVEL</div>
</div>

<!-- ══ START ══ -->
<div class="overlay" id="start-overlay">
  <div style="height:16px"></div>
  <h1>VOICE JOY</h1>
  <div class="emoji-row">🌈 💖 😊 ✨</div>
  <p class="tagline">
    Hum or sing to fly your star!<br>
    <strong style="color:#ffee44">Higher pitch → fly up 🚀</strong><br>
    <strong style="color:#ff88cc">Lower pitch → glide down 🌊</strong><br>
    Collect everything — no dying! 🎉
  </p>
  <div id="mic-error"></div>
  <button class="btn" id="start-btn">LET'S GO! 🎤</button>
  <div class="section-divider" style="margin-top:20px"></div>
  <div id="lb-section">
    <h2>🏆 LEADERBOARD</h2>
    <div id="lb-list"></div>
  </div>
</div>

<!-- ══ END ══ -->
<div class="overlay" id="end-screen">
  <div style="height:10px"></div>
  <h1>AMAZING!</h1>
  <div class="emoji-row" style="font-size:1.6rem">🎊 🌟 🎊</div>

  <div class="end-score-wrap">
    <div class="end-label">YOUR SCORE</div>
    <div class="end-score" id="final-score-num">0</div>
    <div class="end-note" id="high-score-note"></div>
  </div>

  <div id="card-wrap">
    <canvas id="score-card" width="380" height="220"></canvas>
    <div id="share-row">
      <button class="btn-ghost" id="download-btn">⬇ Save Card</button>
      <button class="btn-ghost" id="copy-btn">📋 Copy Score</button>
    </div>
  </div>

  <input id="name-input" type="text" maxlength="18" placeholder="✏️  Enter your name…" autocomplete="off"/>
  <button class="btn" id="submit-btn">Submit Score 🏆</button>

  <div class="section-divider" style="margin-top:4px"></div>
  <div id="lb-section" style="max-width:380px;width:100%;">
    <h2>🏆 LEADERBOARD</h2>
    <div id="lb-list-end"></div>
  </div>

  <button class="btn-ghost" id="play-again-btn" style="margin-top:12px">Play Again 🎤</button>
  <div style="height:16px"></div>
</div>

<script>
// ══ Canvas ══════════════════════════════════════════════
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){
  canvas.width=Math.min(window.innerWidth,520);
  canvas.height=Math.min(window.innerHeight,820);
}
resize(); window.addEventListener('resize',resize);

// ══ Audio ════════════════════════════════════════════════
let audioCtx,analyser,dataArray,bufferLength,audioReady=false;
async function initAudio(){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});}
  catch(e){
    throw new Error(e.name==='NotAllowedError'?'Mic permission denied. Allow microphone in settings and retry.':
      e.name==='NotFoundError'?'No microphone found.':'Mic error: '+e.message);
  }
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
  bufferLength=analyser.fftSize;dataArray=new Float32Array(bufferLength);
  src.connect(analyser);audioReady=true;
}
function detectPitch(){
  if(!audioReady)return{pitch:0,volume:0};
  analyser.getFloatTimeDomainData(dataArray);
  let rms=0;for(let i=0;i<bufferLength;i++)rms+=dataArray[i]*dataArray[i];
  rms=Math.sqrt(rms/bufferLength);
  if(rms<0.007)return{pitch:0,volume:rms};
  const S=bufferLength;let r=new Float32Array(S);
  for(let lag=0;lag<S;lag++){let s=0;for(let i=0;i<S-lag;i++)s+=dataArray[i]*dataArray[i+lag];r[lag]=s;}
  let d=0;while(d<S-1&&r[d]>r[d+1])d++;
  let mx=-1,mp=-1;for(let i=d;i<S;i++)if(r[i]>mx){mx=r[i];mp=i;}
  if(mp<=0)return{pitch:0,volume:rms};
  const p=audioCtx.sampleRate/mp;
  return{pitch:(p>60&&p<1200)?p:0,volume:rms};
}

// ══ Leaderboard ══════════════════════════════════════════
function getScores(){try{return JSON.parse(localStorage.getItem('voicejoy_v2')||'[]');}catch{return[];}}
function saveScore(name,pts){
  const scores=getScores();
  scores.push({name,pts,date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})});
  scores.sort((a,b)=>b.pts-a.pts);scores.splice(10);
  localStorage.setItem('voicejoy_v2',JSON.stringify(scores));
  return scores;
}
function renderLeaderboard(listEl,highlight=-1){
  const scores=getScores();
  if(!scores.length){
    listEl.innerHTML='<div class="lb-empty">No scores yet — be the first! 🌟</div>';return;
  }
  const medals=['🥇','🥈','🥉'];
  const rankClass=['rank-1','rank-2','rank-3'];
  listEl.innerHTML=scores.slice(0,10).map((s,i)=>`
    <div class="lb-row ${rankClass[i]||''} ${i===highlight?'highlight':''}">
      <span class="lb-medal">${medals[i]||'#'+(i+1)}</span>
      <span class="lb-name">${s.name}<span class="lb-date">${s.date}</span></span>
      <span class="lb-pts">✨ ${s.pts}</span>
    </div>`).join('');
}

// ══ Score Card ════════════════════════════════════════════
function drawScoreCard(name,pts){
  const c=document.getElementById('score-card');
  const x=c.getContext('2d');
  const W=c.width,H=c.height;
  // bg
  const bg=x.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1e0640');bg.addColorStop(0.5,'#0d1a55');bg.addColorStop(1,'#091830');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  // aurora bg glow
  const ag=x.createRadialGradient(W*0.3,H*0.4,0,W*0.3,H*0.4,W*0.6);
  ag.addColorStop(0,'rgba(255,100,180,0.15)');ag.addColorStop(1,'transparent');
  x.fillStyle=ag;x.fillRect(0,0,W,H);
  const ag2=x.createRadialGradient(W*0.75,H*0.6,0,W*0.75,H*0.6,W*0.5);
  ag2.addColorStop(0,'rgba(100,180,255,0.12)');ag2.addColorStop(1,'transparent');
  x.fillStyle=ag2;x.fillRect(0,0,W,H);
  // top rainbow bar
  const rbColors=['#ff4466','#ff8844','#ffee44','#44ee88','#44aaff','#aa66ff'];
  rbColors.forEach((col,i)=>{
    x.fillStyle=col;x.fillRect(i*(W/6),0,W/6,7);
  });
  // scattered mini stars
  const starPositions=[[40,40],[320,30],[60,170],[340,160],[180,190],[100,100],[280,110]];
  starPositions.forEach(([sx,sy])=>{
    x.font='12px serif';x.textAlign='center';x.textBaseline='middle';
    x.globalAlpha=0.4;x.fillText('✨',sx,sy);x.globalAlpha=1;
  });
  // big star
  x.font='52px serif';x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='#ffff88';x.shadowBlur=20;
  x.fillText('⭐',W/2,62);x.shadowBlur=0;
  // VOICE JOY label
  x.font='bold 13px Nunito,sans-serif';x.fillStyle='rgba(255,255,255,0.4)';
  x.letterSpacing='4px';x.fillText('VOICE JOY',W/2,100);
  // name
  x.font='bold 22px Nunito,sans-serif';x.fillStyle='#fff';
  x.shadowColor='#ff88cc';x.shadowBlur=10;
  x.fillText(name||'Anonymous',W/2,130);x.shadowBlur=0;
  // score
  const sg=x.createLinearGradient(W/2-80,0,W/2+80,0);
  sg.addColorStop(0,'#ff88cc');sg.addColorStop(0.5,'#ffee44');sg.addColorStop(1,'#88ffcc');
  x.font='bold 48px Nunito,sans-serif';x.fillStyle=sg;
  x.shadowColor='#ffaa00';x.shadowBlur=16;
  x.fillText('✨ '+pts,W/2,178);x.shadowBlur=0;
  // bottom rainbow bar
  rbColors.forEach((col,i)=>{x.fillStyle=col;x.fillRect(i*(W/6),H-7,W/6,7);});
  document.getElementById('card-wrap').style.display='flex';
}

// ══ Game state ════════════════════════════════════════════
let state='idle',score=0,frameCount=0;
let combo=0,comboTimer=0,smoothPitch=0,pitchActive=false;
let hueShift=0,flashColor=null,flashAlpha=0;
const FLASH=['#ff4488','#ffaa00','#44ffaa','#4488ff','#aa44ff','#ff8844'];
const ITEMS=['🌈','💖','😊','⭐','🎀','🌸','🍭','✨','🦋','🎵','🌟','🎊','🍀','🎈','🪄','🌙','💎','🎆'];

const bird={x:0,y:0,vy:0,trail:[],glow:0,wobble:0};
let collectibles=[],particles=[],floatingTexts=[],bgStars=[],shootingStars=[];

function initBgStars(){
  bgStars=[];
  for(let i=0;i<80;i++)bgStars.push({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    r:Math.random()*2+0.2,a:Math.random()*0.8+0.2,
    speed:Math.random()*0.5+0.1,
    twinkle:Math.random()*Math.PI*2,twinkleSpeed:0.02+Math.random()*0.05,
    color:`hsl(${Math.random()*60+200},80%,85%)`
  });
}

function maybeLaunchShootingStar(){
  if(Math.random()<0.004){
    shootingStars.push({
      x:Math.random()*canvas.width,y:Math.random()*canvas.height*0.4,
      vx:3+Math.random()*4,vy:1.5+Math.random()*2,
      life:1,len:80+Math.random()*80,
      color:`hsl(${Math.random()*360},100%,85%)`
    });
  }
}

function spawnCollectible(){
  const m=55;
  collectibles.push({
    x:canvas.width+30,y:m+Math.random()*(canvas.height-m*2),
    emoji:ITEMS[Math.floor(Math.random()*ITEMS.length)],
    size:28+Math.random()*16,
    wobble:Math.random()*Math.PI*2,wobbleSpeed:0.04+Math.random()*0.04,
    spin:0,spinSpeed:(Math.random()-0.5)*0.05,
    speed:1.1+Math.random()*0.6,
    collected:false,pulsePhase:Math.random()*Math.PI*2,
    hue:Math.random()*360
  });
}

function spawnParticles(x,y){
  for(let i=0;i<18;i++){
    const a=(Math.PI*2/18)*i+Math.random()*0.3;
    const sp=2+Math.random()*4;
    particles.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,decay:0.02+Math.random()*0.02,
      size:5+Math.random()*10,
      color:FLASH[Math.floor(Math.random()*FLASH.length)],
      shape:Math.random()<0.4?'star':'circle',
      spin:Math.random()*Math.PI*2,spinSpeed:(Math.random()-0.5)*0.2
    });
  }
}

function spawnFloatText(x,y,txt){
  floatingTexts.push({x,y,text:txt,life:1.2,vy:-2.2,vx:(Math.random()-0.5)*1.2});
}

function resetGame(){
  score=0;frameCount=0;combo=0;comboTimer=0;
  collectibles=[];particles=[];floatingTexts=[];flashColor=null;flashAlpha=0;shootingStars=[];
  bird.x=canvas.width*0.22;bird.y=canvas.height*0.5;
  bird.vy=0;bird.trail=[];bird.glow=0;
  document.getElementById('score-display').textContent='✨ 0';
  document.getElementById('combo-display').style.opacity='0';
  initBgStars();
  for(let i=0;i<5;i++){spawnCollectible();collectibles[i].x=canvas.width*0.4+i*155;}
}

const PITCH_LOW=100,PITCH_HIGH=500;
function pitchToForce(p){
  // 1.0 = fully high pitch (fly up), 0.0 = fully low pitch (fall down), 0.5 = hover
  const t=Math.max(0,Math.min(1,(p-PITCH_LOW)/(PITCH_HIGH-PITCH_LOW)));
  return (0.5-t)*-16;
}

// ══ Draw ══════════════════════════════════════════════════
function drawBg(){
  hueShift=(hueShift+0.12)%360;
  const bg=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  bg.addColorStop(0,`hsl(${(hueShift+260)%360},55%,9%)`);
  bg.addColorStop(0.5,`hsl(${(hueShift+220)%360},50%,12%)`);
  bg.addColorStop(1,`hsl(${(hueShift+180)%360},45%,8%)`);
  ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  // aurora bands
  for(let i=0;i<4;i++){
    const y=canvas.height*(0.15+i*0.25)+Math.sin(Date.now()/2200+i*1.3)*35;
    const ag=ctx.createLinearGradient(0,y-50,0,y+50);
    ag.addColorStop(0,'rgba(0,0,0,0)');
    ag.addColorStop(0.5,`hsla(${(hueShift+i*70)%360},90%,65%,0.07)`);
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.fillRect(0,y-50,canvas.width,100);
  }
  // bg stars
  for(const s of bgStars){
    s.twinkle+=s.twinkleSpeed;
    const a=s.a*(0.5+0.5*Math.sin(s.twinkle));
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
    s.x-=s.speed;if(s.x<0){s.x=canvas.width;s.y=Math.random()*canvas.height;}
  }
  // shooting stars
  maybeLaunchShootingStar();
  for(const s of shootingStars){
    ctx.save();ctx.globalAlpha=s.life;
    const grad=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*(s.len/5),s.y-s.vy*(s.len/5));
    grad.addColorStop(0,s.color);grad.addColorStop(1,'transparent');
    ctx.strokeStyle=grad;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*(s.len/5),s.y-s.vy*(s.len/5));
    ctx.stroke();ctx.restore();
    s.x+=s.vx;s.y+=s.vy;s.life-=0.018;
  }
  shootingStars=shootingStars.filter(s=>s.life>0);
}

function drawRainbowTrail(){
  const rb=['#ff4466','#ff8844','#ffee44','#44ee88','#44aaff','#aa66ff'];
  for(let i=1;i<bird.trail.length;i++){
    const t=bird.trail[i],tp=bird.trail[i-1];
    const frac=i/bird.trail.length;
    const col=rb[Math.floor(frac*rb.length)];
    const r=parseInt(col.slice(1,3),16),g=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
    ctx.beginPath();ctx.moveTo(tp.x,tp.y);ctx.lineTo(t.x,t.y);
    ctx.strokeStyle=`rgba(${r},${g},${b},${frac*0.75})`;
    ctx.lineWidth=8*frac;ctx.lineCap='round';ctx.stroke();
  }
}

function drawBird(){
  drawRainbowTrail();
  const {x,y,vy,glow}=bird;
  // pulsing glow ring
  const pulseR=45+Math.sin(bird.wobble*1.5)*6+glow*18;
  const gr=ctx.createRadialGradient(x,y,0,x,y,pulseR);
  gr.addColorStop(0,`rgba(255,200,255,${0.2+glow*0.28})`);
  gr.addColorStop(0.5,`rgba(180,100,255,${0.08+glow*0.1})`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(x,y,pulseR,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
  ctx.save();ctx.translate(x,y);
  ctx.rotate(Math.max(-0.4,Math.min(0.4,vy*0.04)));
  const sz=32+Math.sin(bird.wobble)*3;
  ctx.font=`${sz}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#ffffaa';ctx.shadowBlur=glow*25+8;
  ctx.fillText('⭐',0,0);
  ctx.restore();
  bird.wobble+=0.09;
}

function drawStarShape(cx,cy,r,color,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=Math.PI/5*i-Math.PI/2;
    const rad=i%2===0?r:r*0.4;
    if(i===0)ctx.moveTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a));
    else ctx.lineTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a));
  }
  ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    if(p.shape==='star')drawStarShape(p.x,p.y,p.size*p.life,p.color,p.life*0.9);
    else{
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.globalAlpha=p.life*0.9;ctx.fill();ctx.globalAlpha=1;
    }
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.life-=p.decay;
  }
}

function drawCollectibles(){
  for(const c of collectibles){
    if(c.collected)continue;
    const pulse=1+Math.sin(c.pulsePhase)*0.1;
    c.pulsePhase+=0.07;c.wobble+=c.wobbleSpeed;c.spin+=c.spinSpeed;
    const dy2=c.y+Math.sin(c.wobble)*9;
    ctx.save();ctx.translate(c.x,dy2);ctx.rotate(c.spin);ctx.scale(pulse,pulse);
    // rainbow halo
    const haloGrd=ctx.createRadialGradient(0,0,0,0,0,c.size*1.5);
    haloGrd.addColorStop(0,`hsla(${(c.hue+hueShift)%360},100%,70%,0.3)`);
    haloGrd.addColorStop(0.6,`hsla(${(c.hue+hueShift+60)%360},100%,60%,0.1)`);
    haloGrd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(0,0,c.size*1.5,0,Math.PI*2);ctx.fillStyle=haloGrd;ctx.fill();
    ctx.font=`${c.size}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='white';ctx.shadowBlur=14;ctx.fillText(c.emoji,0,0);
    ctx.restore();
    c.x-=c.speed;
  }
}

function drawFloatingTexts(){
  for(const ft of floatingTexts){
    ctx.save();ctx.globalAlpha=Math.min(1,ft.life);
    ctx.font=`bold ${14+ft.life*5}px Nunito,sans-serif`;
    ctx.fillStyle='#ffee44';ctx.textAlign='center';
    ctx.shadowColor='#ff8800';ctx.shadowBlur=14;
    ctx.fillText(ft.text,ft.x,ft.y);ctx.restore();
    ft.x+=ft.vx;ft.y+=ft.vy;ft.vy*=0.95;ft.life-=0.016;
  }
}

function drawFlash(){
  if(flashAlpha>0){
    ctx.fillStyle=flashColor;ctx.globalAlpha=flashAlpha;
    ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=1;
    flashAlpha-=0.035;
  }
}

// ══ Main loop ═════════════════════════════════════════════
const scoreEl=document.getElementById('score-display');
const comboEl=document.getElementById('combo-display');
const micFillEl=document.getElementById('mic-fill');

function gameLoop(){
  requestAnimationFrame(gameLoop);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBg();
  if(state!=='playing'){
    ctx.save();ctx.translate(canvas.width*0.22,canvas.height*0.5+Math.sin(Date.now()/700)*14);
    ctx.font='36px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#ffffaa';ctx.shadowBlur=18;ctx.fillText('⭐',0,0);ctx.restore();
    return;
  }
  const{pitch,volume}=detectPitch();
  micFillEl.style.width=Math.min(100,volume/0.08*100)+'%';
  if(pitch>0&&volume>0.007){smoothPitch=smoothPitch*0.55+pitch*0.45;pitchActive=true;}
  else pitchActive=false;
  if(pitchActive){
    const force=pitchToForce(smoothPitch);
    bird.vy=bird.vy*0.82+force*0.18;
    bird.glow=Math.min(1,bird.glow+0.1);
  }else{
    bird.vy+=0.38; // gravity when silent
    bird.glow=Math.max(0,bird.glow-0.05);
  }
  bird.vy=Math.max(-11,Math.min(11,bird.vy));bird.y+=bird.vy;
  if(bird.y<20){bird.y=20;bird.vy=Math.abs(bird.vy)*0.5;}
  if(bird.y>canvas.height-20){bird.y=canvas.height-20;bird.vy=-Math.abs(bird.vy)*0.5;}
  bird.trail.push({x:bird.x,y:bird.y});
  if(bird.trail.length>22)bird.trail.shift();
  frameCount++;
  if(frameCount%80===0)spawnCollectible();
  for(const c of collectibles){
    if(c.collected)continue;
    const dx=bird.x-c.x,dy2=bird.y-(c.y+Math.sin(c.wobble)*9);
    if(Math.sqrt(dx*dx+dy2*dy2)<c.size*0.9+16){
      c.collected=true;score++;combo++;comboTimer=115;
      spawnParticles(c.x,c.y);
      flashColor=FLASH[Math.floor(Math.random()*FLASH.length)];flashAlpha=0.17;
      const txt=combo>=8?`🔥🔥 ${combo}x MEGA!!`:combo>=5?`🔥 ${combo}x COMBO!!`:combo>=3?`⚡ ${combo}x combo!`:'✨ +1';
      spawnFloatText(c.x,c.y-24,txt);
      scoreEl.textContent='✨ '+score;
      scoreEl.style.transform='scale(1.4)';
      setTimeout(()=>scoreEl.style.transform='scale(1)',160);
    }
  }
  if(comboTimer>0){
    comboTimer--;
    if(combo>1){comboEl.style.opacity='1';comboEl.textContent=combo>=8?`🔥🔥 ${combo}x MEGA!!`:combo>=5?`🔥 ${combo}x COMBO!!`:`⚡ ${combo}x`;}
  }else{combo=0;comboEl.style.opacity='0';}
  collectibles=collectibles.filter(c=>c.x>-70);
  particles=particles.filter(p=>p.life>0);
  floatingTexts=floatingTexts.filter(f=>f.life>0);
  drawCollectibles();drawParticles();drawBird();drawFloatingTexts();drawFlash();
}

// ══ End game ══════════════════════════════════════════════
function endGame(){
  state='end';
  document.getElementById('stop-btn').style.display='none';
  document.getElementById('final-score-num').textContent=score;
  const scores=getScores();
  const isTopScore=score>0&&(!scores.length||score>=scores[0].pts);
  document.getElementById('high-score-note').textContent=
    isTopScore?'🏆 New #1 High Score!':scores.length?`Current best: ✨ ${scores[0].pts}`:'';
  renderLeaderboard(document.getElementById('lb-list-end'));
  drawScoreCard('',score);
  document.getElementById('end-screen').style.display='flex';
}
document.getElementById('stop-btn').addEventListener('click',endGame);

document.getElementById('submit-btn').addEventListener('click',()=>{
  const name=document.getElementById('name-input').value.trim()||'Anonymous';
  const scores=saveScore(name,score);
  const rank=scores.findIndex(s=>s.name===name&&s.pts===score);
  renderLeaderboard(document.getElementById('lb-list-end'),rank);
  renderLeaderboard(document.getElementById('lb-list'));
  drawScoreCard(name,score);
  document.getElementById('submit-btn').textContent='✅ Submitted!';
  document.getElementById('submit-btn').disabled=true;
  document.getElementById('submit-btn').style.background='linear-gradient(135deg,#44aa88,#44ddaa)';
});

document.getElementById('download-btn').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='voicejoy-score.png';
  a.href=document.getElementById('score-card').toDataURL();a.click();
});

document.getElementById('copy-btn').addEventListener('click',()=>{
  const name=document.getElementById('name-input').value.trim()||'Anonymous';
  navigator.clipboard.writeText(`I scored ✨ ${score} on Voice Joy! 🌈💖😊 Can you beat me? #VoiceJoy`).then(()=>{
    const btn=document.getElementById('copy-btn');
    btn.textContent='✅ Copied!';setTimeout(()=>btn.textContent='📋 Copy Score',2200);
  });
});

document.getElementById('play-again-btn').addEventListener('click',()=>{
  document.getElementById('end-screen').style.display='none';
  document.getElementById('submit-btn').textContent='Submit Score 🏆';
  document.getElementById('submit-btn').disabled=false;
  document.getElementById('submit-btn').style.background='';
  document.getElementById('card-wrap').style.display='none';
  resetGame();state='playing';
  document.getElementById('stop-btn').style.display='block';
});

// ══ Start ═════════════════════════════════════════════════
document.getElementById('start-btn').addEventListener('click',async()=>{
  const btn=document.getElementById('start-btn');
  if(!audioReady){
    btn.textContent='ALLOW MIC...';btn.disabled=true;
    try{await initAudio();btn.disabled=false;}
    catch(e){
      btn.textContent='TAP TO RETRY 🎤';btn.disabled=false;
      const err=document.getElementById('mic-error');
      err.textContent=e.message;err.style.display='block';return;
    }
  }
  document.getElementById('mic-error').style.display='none';
  renderLeaderboard(document.getElementById('lb-list'));
  resetGame();state='playing';
  document.getElementById('start-overlay').style.display='none';
  document.getElementById('stop-btn').style.display='block';
});

gameLoop();
</script>
